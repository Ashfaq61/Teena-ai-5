name: TEENA AI Android CI & Signed Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Debug Build, Unit Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & ensure SDK 35 / build-tools 35.0.0
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner."
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Generate Debug APK SHA-256 checksums
        run: |
          mkdir -p dist-debug
          cp app/build/outputs/apk/debug/*.apk dist-debug/
          (cd dist-debug && sha256sum *.apk > SHA256SUMS.txt)
          cat dist-debug/SHA256SUMS.txt

      - name: Upload Unit Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teena-ai-test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: teena-ai-debug-apk
          path: dist-debug/*

  signed-release:
    name: Build Signed Release APK & Publish
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses & ensure SDK 35 / build-tools 35.0.0
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "::error::ANDROID_HOME is not set on this runner."
            exit 1
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare Gradle wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x gradlew

      - name: Prepare Release Signing Keystore (Permanent Secrets or Temporary Key)
        id: signing
        env:
          SECRET_KEYSTORE_BASE64: ${{ secrets.TEENA_KEYSTORE_BASE64 }}
          SECRET_KEYSTORE_PASSWORD: ${{ secrets.TEENA_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.TEENA_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.TEENA_KEY_PASSWORD }}
        run: |
          if [ -n "$SECRET_KEYSTORE_BASE64" ] && [ -n "$SECRET_KEYSTORE_PASSWORD" ] && [ -n "$SECRET_KEY_ALIAS" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "Using permanent signing keystore from GitHub Secrets."
            printf '%s' "$SECRET_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/teena-release.jks"
            {
              echo "TEENA_KEYSTORE_PATH=$RUNNER_TEMP/teena-release.jks"
              echo "TEENA_KEYSTORE_PASSWORD=$SECRET_KEYSTORE_PASSWORD"
              echo "TEENA_KEY_ALIAS=$SECRET_KEY_ALIAS"
              echo "TEENA_KEY_PASSWORD=$SECRET_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signing_mode=permanent" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets missing. Generating ephemeral temporary keystore for this build (TEMPORARY KEY - update nahi hoga, uninstall karke install karo)."
            TEMP_PASS=$(openssl rand -base64 32 | tr -d '/+=\n')
            echo "::add-mask::$TEMP_PASS"
            keytool -genkeypair -noprompt \
              -keystore "$RUNNER_TEMP/teena-temp.jks" \
              -alias "teena-temp" \
              -keyalg RSA \
              -keysize 4096 \
              -validity 365 \
              -storepass "$TEMP_PASS" \
              -keypass "$TEMP_PASS" \
              -dname "CN=TEENA AI Temporary, OU=CI, O=TEENA, L=Unknown, ST=Unknown, C=US"
            {
              echo "TEENA_KEYSTORE_PATH=$RUNNER_TEMP/teena-temp.jks"
              echo "TEENA_KEYSTORE_PASSWORD=$TEMP_PASS"
              echo "TEENA_KEY_ALIAS=teena-temp"
              echo "TEENA_KEY_PASSWORD=$TEMP_PASS"
            } >> "$GITHUB_ENV"
            unset TEMP_PASS
            echo "signing_mode=temporary" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signatures & Generate SHA-256 Checksums
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          if [ ! -x "$APKSIGNER" ]; then
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          fi
          mkdir -p dist-release
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "Verifying $(basename "$apk") ..."
            "$APKSIGNER" verify --print-certs "$apk"
            base_name=$(basename "$apk")
            if [ "${{ steps.signing.outputs.signing_mode }}" = "temporary" ]; then
              out_name="${base_name%.apk}-TEMPORARY-KEY.apk"
            else
              out_name="$base_name"
            fi
            cp "$apk" "dist-release/$out_name"
          done
          (cd dist-release && sha256sum *.apk > SHA256SUMS.txt)
          cat dist-release/SHA256SUMS.txt

      - name: Clean up Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/teena-release.jks" "$RUNNER_TEMP/teena-temp.jks"

      - name: Extract Version Metadata
        id: meta
        run: |
          VERSION_NAME=$(grep 'versionName =' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep 'versionCode =' app/build.gradle.kts | head -n 1 | sed -E 's/.*= ([0-9]+).*/\1/')
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=v${VERSION_NAME}-b${VERSION_CODE}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Release Notes
        id: notes
        run: |
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "## TEENA AI Release \`${{ steps.meta.outputs.version_name }}\` (versionCode \`${{ steps.meta.outputs.version_code }}\`)"
            echo ""
            if [ "${{ steps.signing.outputs.signing_mode }}" = "temporary" ]; then
              echo "> **TEMPORARY KEY - update nahi hoga, uninstall karke install karo**"
              echo ">"
              echo "> Yeh APK runner par generate ki gayi temporary key se sign hua hai kyunki permanent signing secrets configured nahi the. Agli release in-place update nahi hogi."
              echo ""
            else
              echo "- **Signing:** Permanent release keystore (GitHub Secrets)."
            fi
            echo "- **Application ID:** \`com.teena.assistant\`"
            echo "- **Oppo F15 / arm64 devices:** \`app-arm64-v8a-release\` (ya \`app-universal-release\`) APK download karein."
            echo ""
            echo "### SHA-256 Checksums"
            echo '```'
            cat dist-release/SHA256SUMS.txt
            echo '```'
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload Signed Release APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: teena-ai-${{ steps.signing.outputs.signing_mode }}-release-${{ steps.meta.outputs.release_tag }}
          path: dist-release/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: >-
            TEENA AI ${{ steps.meta.outputs.version_name }} (build ${{ steps.meta.outputs.version_code }})${{ steps.signing.outputs.signing_mode == 'temporary' && ' [TEMPORARY KEY]' || '' }}
          prerelease: true
          generate_release_notes: false
          body: ${{ steps.notes.outputs.body }}
          files: |
            dist-release/*.apk
            dist-release/SHA256SUMS.txt
